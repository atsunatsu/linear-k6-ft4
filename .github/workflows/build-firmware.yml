name: Build FT4 Firmware

on:
  push:
    branches: [main]
    paths:
      - 'uvk5cec-0.3q/**'
      - '.github/workflows/build-firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      
      - name: Install Python dependencies
        run: pip3 install crcmod
      
      - name: Build firmware
        run: |
          cd uvk5cec-0.3q
          make -j$(nproc)
      
      - name: Pack firmware
        run: |
          cd uvk5cec-0.3q
          mkdir -p ../outputs
          python3 fw-pack.py firmware.bin KD8CEC CEC_01C ../outputs/ft4-firmware-packed.bin
          ls -la ../outputs/
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ft4-firmware
          path: outputs/*.bin
          retention-days: 30
